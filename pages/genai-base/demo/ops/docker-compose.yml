version: "3.9"
# 教学用：オンプレ運用を想定した最小構成（app + postgres + nginx）。
# 実プロジェクトでは運用要件（バックアップ・監視・SSL）を加味して拡張すること。
services:
  app:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pg_data:
